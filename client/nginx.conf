server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ── React SPA: catch-all so React Router handles all routes ──────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy → backend container (Docker service name: "backend") ───────
    location /api/ {
        proxy_pass         http://backend:5000/api/;
        proxy_http_version 1.1;

        # Required for Socket.io WebSocket upgrades
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
    }

    # ── Proxy uploaded files served by Express ────────────────────────────────
    location /uploads/ {
        proxy_pass http://backend:5000/uploads/;
        proxy_set_header Host $host;
    }

    # ── Socket.io WebSocket endpoint ──────────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://backend:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 86400;
    }

    # ── Static asset caching ──────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
