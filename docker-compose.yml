services:
  # ── Backend: Node.js / Express / Socket.io ──────────────────────────────────
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sprintly-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "5000:5000"
    volumes:
      # Persist uploaded files across container restarts
      - uploads_data:/app/uploads
    networks:
      - sprintly-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Frontend: React (Vite build) served by Nginx ────────────────────────────
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      # VITE_API_URL is baked in at build time; for local Docker use the
      # Nginx proxy, so we keep it as the container's own origin.
      args:
        VITE_API_URL: http://localhost:5000
    container_name: sprintly-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sprintly-net

# ── Named volumes ──────────────────────────────────────────────────────────────
volumes:
  uploads_data:

# ── Shared network ─────────────────────────────────────────────────────────────
networks:
  sprintly-net:
    driver: bridge
